name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The version check in tests/test_version_bump.py needs the base branch and the merge base.
          fetch-depth: 0

      # Take the latest release of the simple-english linter, not a pinned commit.
      - name: Find the latest SimpleEnglish release
        id: linter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tag=$(gh release view --repo AminBlg/SimpleEnglish --json tagName --jq .tagName) || [ -z "$tag" ]; then
            echo "::error::Cannot get the latest release of AminBlg/SimpleEnglish."
            exit 1
          fi
          echo "Using SimpleEnglish release $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: AminBlg/SimpleEnglish
          ref: ${{ steps.linter.outputs.tag }}
          path: .simple-english
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # tests/test_eval_front_matter.py parses the eval case files with PyYAML.
      - name: Install PyYAML
        run: python3 -m pip install PyYAML==6.0.3

      # The tests of the eval fixtures build and test a .NET solution.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Take the latest Claude Code for the tests of claude plugin validate and claude plugin details.
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run the tests and the linters
        env:
          SIMPLE_ENGLISH_DIR: ${{ github.workspace }}/.simple-english
        run: python3 -m unittest discover -s tests -v

  # The tests of the plugin scripts on Windows: Git Bash, PowerShell, and Windows paths (issue #182).
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run the tests of the plugin scripts
        working-directory: tests
        run: python -m unittest -v test_backup_move test_merge_projects test_failure_check test_group_diff test_check_report test_trim_report test_openbsd_lint test_kb_plugin test_testkit test_support
